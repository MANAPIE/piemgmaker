# 모델 프로파일 — 생성 모델 계열 선택지.
# 각 파일은 sha256로 핀한다.

default: qwen-image

profiles:
  - id: qwen-image
    label: "Qwen-Image (20B Q8)"
    workflow_gen: object-gen-qwen-v1
    workflow_inpaint: object-inpaint-qwen-v1
    workflow_styleref: object-gen-styleref-v1
    workflow_logoref: object-gen-logoref-v1   # 로고 내용 재현 트랙 — styleref와 같은 Edit 스택
    supports_negative: true
    sampling: { steps: 20, cfg: 2.5 }
    manifest:
      model_id: qwen-image-20b-q8-gguf
      files:
        - { name: Qwen_Image-Q8_0.gguf, kind: unet, sha256: 43142b32778dc0568c27395abc6f8291ac53f1de0b98eed919712cf161f248de }
        - { name: qwen_2.5_vl_7b_fp8_scaled.safetensors, kind: clip, sha256: cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4 }
        - { name: qwen_image_vae.safetensors, kind: vae, sha256: a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f }
    styleref_manifest:
      model_id: qwen-image-edit-2511-q8-gguf
      files:
        - { name: qwen-image-edit-2511-Q8_0.gguf, kind: unet, sha256: ab4f0622fb002fccaaa679a2ecce6fd1b3190d8ea28a5b7b2b17b8669bc24afa }
        - { name: qwen_2.5_vl_7b_fp8_scaled.safetensors, kind: clip, sha256: cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4 }
        - { name: qwen_image_vae.safetensors, kind: vae, sha256: a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f }
    remote:
      backend_group: qwen
      # 원격 GPU(L4 24GB)에 스택을 맞추기 위한 파일 치환 — 로컬은 Q8 유지.
      # 치환은 base·styleref·native_alpha 매니페스트에 각각 매칭되는 것만 적용된다.
      # sha256은 HF LFS etag로 확인해 핀했고, fetch_models_remote.sh가 전송 시 재검증한다.
      files:
        - { replaces: Qwen_Image-Q8_0.gguf, name: Qwen_Image-Q6_K.gguf, sha256: 0c60643ee869161ee7acd530f7faf1cb2361f131e1ebae27b95fdc481b6df2b2 }
        - { replaces: qwen-image-edit-2511-Q8_0.gguf, name: qwen-image-edit-2511-Q6_K.gguf, sha256: fdc28e5b8f7d9cfe0399fd1700c375f25f000fc4159bbdb0d4a809ae898eb759 }
        - { replaces: qwen-image-layered-Q8_0.gguf, name: qwen-image-layered-Q6_K.gguf, sha256: 9008bd45e6918671ff6d1b6e8e46374c12a8339a4e26740426b0f557958e5431 }
      supports_styleref: true
      supports_logoref: true    # styleref와 동일한 Edit unet — 추가 파일 없음
      supports_native_alpha: true
    native_alpha:
      workflow: object-gen-native-alpha-v1
      sampling: { steps: 20, cfg: 2.5 }
      manifest:
        model_id: qwen-image-layered-q8-gguf
        files:
          - { name: qwen-image-layered-Q8_0.gguf, kind: unet, sha256: 0d9f3cc357f8ecaf9547908fc24ac9cf05d14f659115ac0aa24c7fb5e86aa92c }
          - { name: qwen_2.5_vl_7b_fp8_scaled.safetensors, kind: clip, sha256: cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4 }
          - { name: qwen_image_layered_vae.safetensors, kind: vae, sha256: c5320595fc61859ccdd0282184208f7b781c983b8ce4c6bc3e7723a807d3d28d }

  - id: flux2-dev
    label: "FLUX.2 dev (Q8)"
    workflow_gen: object-gen-flux2-v1
    workflow_inpaint: object-inpaint-flux2-v1
    workflow_styleref: null      # v1 미지원 — 참조 이미지는 qwen-image 프로파일 사용
    supports_negative: false     # guidance 증류 모델 — 네거티브 미사용
    sampling: { steps: 20, cfg: 4.0 }
    remote:
      backend_group: flux2
      # 원격 unet은 HF 배포 빌드(orabazes)를 쓴다 — 파일명은 로컬과 같지만 다른 Q8 빌드라 sha가 다르다.
      # TE·VAE는 HF 배포본이 로컬 보유본과 sha까지 동일해 치환이 필요 없다.
      files:
        - { replaces: flux2-dev-Q8_0.gguf, name: flux2-dev-Q8_0.gguf, sha256: fe4622c714ad0d977913df9bebbd5a7a132204435e738669925d71d34e4169a9 }
      supports_styleref: false
      supports_native_alpha: false
    manifest:
      model_id: flux2-dev-q8-gguf
      files:
        - { name: flux2-dev-Q8_0.gguf, kind: unet, sha256: 09d005300dd8dcbbd489bb75ada6254145c84c2c9c3d7cc1829e3c5dedcb42ce }
