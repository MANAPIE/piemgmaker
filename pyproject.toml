[project]
name = "piemgmaker"
version = "0.1.0"
description = "오브젝트 머테리얼 생성기 — 배너용 그래픽 오브젝트를 알파 PNG로 산출"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.3",
    "numpy>=1.26",
    "scikit-image>=0.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.139.1",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
piemgmaker = "piemgmaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piemgmaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src 레이아웃 — 설치 없이 tests에서 import 가능하게
pythonpath = ["src"]
