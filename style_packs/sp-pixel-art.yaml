# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-pixel-art
name: 픽셀 아트
version: 0.1.0
prompt_template: "{subject}, retro 8-bit pixel art, chunky pixels, limited vivid palette, clean sprite silhouette, {mood}"
negative: "smooth gradients, photorealistic, 3d render, background scenery, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: none
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 픽셀 아트 — 페더·그레인이 픽셀 경계를 망치므로 최소 강도
  strength: 0.3
  relight: 0.25
  contact_shadow: 0.4
  drop_shadow: 0.2
  light_wrap: 0.1
  grain_match: false
