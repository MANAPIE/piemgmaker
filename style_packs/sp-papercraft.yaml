# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-papercraft
name: 페이퍼 크래프트
version: 0.1.0
prompt_template: "{subject}, layered paper craft style, cut paper edges, subtle paper texture, gentle layered depth, pastel tones, {mood}"
negative: "photorealistic, glossy plastic, background scenery, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: soft_floor
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 페이퍼크래프트 — 종이 레이어 특유의 또렷한 드롭 섀도
  strength: 0.6
  relight: 0.55
  contact_shadow: 0.7
  drop_shadow: 0.45
  light_wrap: 0.25
  grain_match: true
