# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-watercolor
name: 수채화
version: 0.1.1
prompt_template: "{subject}, delicate watercolor illustration painted directly on a clean white background, soft pigment washes, gentle color bleeding, {mood}"
negative: "beige paper backdrop, kraft paper texture, visible paper sheet behind, 3d render, photorealistic, hard outlines, background scenery, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: none
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 수채화 — 종이 질감 그레인을 살리고 조명은 부드럽게
  strength: 0.5
  relight: 0.4
  contact_shadow: 0.4
  drop_shadow: 0.25
  light_wrap: 0.35
  grain_match: true
