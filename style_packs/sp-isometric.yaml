# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-isometric
name: 아이소메트릭
version: 0.1.0
prompt_template: "{subject}, isometric miniature 3D diorama, 45-degree view, cute compact proportions, clean detailed surfaces, {mood}"
negative: "background scenery, photo backdrop, flat front view, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: soft_floor
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 아이소메트릭 — 자산도 같은 각도로 눕혀야 평면 위에 붙는다
  strength: 0.55
  relight: 0.5
  contact_shadow: 0.6
  drop_shadow: 0.3
  light_wrap: 0.25
  grain_match: true
  geometry:
    tilt: iso
