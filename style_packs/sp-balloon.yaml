# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-balloon
name: 벌룬 3D
version: 0.1.0
prompt_template: "{subject}, inflatable glossy balloon 3d style, puffy rounded volume, soft plastic sheen, playful festive feel, {mood}"
negative: "deflated, matte, background scenery, photo backdrop, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: soft_floor
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 풍선은 떠 있는 느낌 — 접지보다 드롭 섀도 비중을 높게
  strength: 0.55
  relight: 0.5
  contact_shadow: 0.5
  drop_shadow: 0.45
  light_wrap: 0.3
  grain_match: true
