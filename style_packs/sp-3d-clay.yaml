# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-3d-clay
name: 클레이 3D
version: 0.1.0
prompt_template: "{subject}, soft clay 3D render, matte claymation texture, rounded friendly shapes, pastel tones, soft diffuse lighting, {mood}"
negative: "background scenery, photo backdrop, glossy reflections, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: soft_floor
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 무광 점토 — 확산광이라 리라이트·접지 그림자를 강하게
  strength: 0.6
  relight: 0.6
  contact_shadow: 0.7
  drop_shadow: 0.35
  light_wrap: 0.3
  grain_match: true
