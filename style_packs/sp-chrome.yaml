# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-chrome
name: 크롬 메탈
version: 0.1.1
prompt_template: "{subject}, liquid chrome metal, mirror-polished surface reflecting a bright soft studio, luminous silver reflections, sharp specular highlights, premium metallic feel, {mood}"
negative: "matte surface, dark void reflections, black mirror areas, background scenery, photo backdrop, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: soft_floor
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 반사 금속 — 주변광 반영(리라이트·라이트랩)을 가장 강하게
  strength: 0.65
  relight: 0.75
  contact_shadow: 0.6
  drop_shadow: 0.4
  light_wrap: 0.45
  grain_match: true
