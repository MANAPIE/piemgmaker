# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-flat-illust
name: 플랫 일러스트
version: 0.1.0
prompt_template: "{subject}, flat vector illustration, clean geometric shapes, bold solid colors, minimal detail, crisp edges, {mood}"
negative: "3d render, photorealistic, gradient shading, background scenery, text, letters, watermark, frame, border, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: none
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 플랫 일러스트 — 그레인이 스타일을 해치므로 끔, 전체적으로 절제
  strength: 0.4
  relight: 0.3
  contact_shadow: 0.5
  drop_shadow: 0.3
  light_wrap: 0.2
  grain_match: false
