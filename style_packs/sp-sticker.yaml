# 사용자 교체 전제. 모델·샘플링은 프로파일이 결정.
id: sp-sticker
name: 스티커
version: 0.1.0
prompt_template: "{subject}, die-cut sticker style, thick white sticker border, bold cartoon shading, vivid saturated colors, glossy vinyl finish, {mood}"
negative: "photorealistic, background scenery, photo backdrop, text, letters, watermark, frame, cropped edges"
palette: []
reference_set: []
loras: []
material_class: opaque
shadow_policy: none
workflow_template: object-gen-v1
model_manifest:
  model_id: profile-managed
  files: []
matting:
  strategy: segment
  model: BiRefNet-matting
  hash: null
blend: # 스티커 — 얹힌 느낌 자체가 컨셉이라 최소 개입
  strength: 0.25
  relight: 0.2
  contact_shadow: 0.4
  drop_shadow: 0.2
  light_wrap: 0.15
  grain_match: false
